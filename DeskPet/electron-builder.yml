appId: com.deskpet.app
productName: DeskPet
copyright: Copyright © 2025 DeskPet Contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"

extraResources:
  - from: build/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/uiohook-napi/**"

# ---------------------------------------------------------------- Linux
linux:
  icon: build/icon.png
  category: Utility
  maintainer: DeskPet Contributors <deskpet@users.noreply.github.com>
  synopsis: A desktop pet for Linux
  description: |
    DeskPet is a transparent desktop companion for Linux (X11/XWayland).
    Cut a character out of any picture, give it reactions, custom actions and
    voices, and connect an OpenAI-compatible model.
  executableName: deskpet
  executableArgs:
    - --ozone-platform=x11
  artifactName: ${productName}-${version}-${arch}.${ext}
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: pacman
      arch:
        - x64
  desktop:
    entry:
      Name: DeskPet
      Comment: A desktop pet for Linux
      Categories: Utility;Game;
      Terminal: false
      X-GNOME-UsesNotifications: true

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish: null
