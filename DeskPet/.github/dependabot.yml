version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-vite
      tooling:
        patterns:
          - vite
          - typescript
          - "@types/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
