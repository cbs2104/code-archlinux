name: ✨ Feature request
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 例如：希望动作能按时间自动播放
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决？
      description: 描述预期行为、界面或配置方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 抠图 / 形象
        - 动作 / 序列帧 / 音效
        - 键盘鼠标联动
        - 语音 / TTS / STT
        - AI
        - 设置界面
        - 打包 / 平台适配
        - 文档 / 其他

  - type: textarea
    id: extra
    attributes:
      label: 其他信息 / 参考

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue
          required: true
