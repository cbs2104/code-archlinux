name: 🐞 Bug report
description: 报告一个可以复现的问题
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现步骤和日志。安全漏洞请不要公开提交，见 SECURITY.md。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望发生什么？
      placeholder: 桌宠启动后...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开设置 → 抠图工坊
        2. 导入...
        3. 点击...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Arch Linux
        - 其他 Linux
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Linux 会话 / 桌面环境（其他系统可跳过）
      options:
        - 不适用
        - X11 (KDE)
        - Wayland + XWayland (KDE)
        - X11 (GNOME)
        - Wayland + XWayland (GNOME)
        - 其他 X11
        - 原生 Wayland
        - 其他

  - type: input
    id: version
    attributes:
      label: DeskPet 版本
      description: 设置 → 关于 里可以看到；开发模式请填 commit
      placeholder: 1.0.3
    validations:
      required: true

  - type: input
    id: electron
    attributes:
      label: Electron / Node 版本（开发模式）
      placeholder: Electron 44.9.1 / Node 26.12.0

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 设置 → 关于 →「查看日志」，或粘贴终端输出
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 其他信息
      description: 可以直接拖拽图片到这里

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue
          required: true
        - label: 我使用的是最新版本或 main 分支
          required: true
