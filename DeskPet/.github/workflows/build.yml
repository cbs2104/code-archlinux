name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: deskpet-build
          path: out
          if-no-files-found: error

  package:
    name: Package (Linux)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libarchive-tools

      - name: Build installers
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
          if-no-files-found: error
          retention-days: 14
